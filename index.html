<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#07070c">
<title>MANHUNT</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#07070c;--cd:#13131d;--ln:#2b2b40;--tx:#f4f4fa;--mu:#8a8aa6;--rd:#ff2d55;--cy:#19e6ff;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
section{display:none;height:100%;flex-direction:column;padding:14px;gap:10px;overflow-y:auto}
section.on{display:flex}
h1{margin:10px 0 0;font-size:42px;letter-spacing:7px;text-align:center;color:var(--rd);text-shadow:0 0 12px var(--rd),0 0 34px #ff2d5588}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:12px}
.mu{color:var(--mu)}.rd{color:var(--rd)}.cy{color:var(--cy)}
input[type=text]{width:100%;padding:14px;border-radius:12px;border:1px solid var(--ln);background:#0c0c14;color:var(--tx);font-size:18px}
input[type=range]{width:100%;accent-color:var(--rd);margin:2px 0 8px}
button{padding:14px;border-radius:12px;border:1px solid var(--rd);background:#2a0a12;color:var(--tx);font-size:16px;font-weight:700;box-shadow:0 0 14px #ff2d5544}
button.c{border-color:var(--cy);background:#062a30;box-shadow:0 0 14px #19e6ff44}
button.g{border-color:var(--ln);background:transparent;box-shadow:none;color:var(--mu)}
button:disabled{opacity:.4}[hidden]{display:none!important}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.sr{display:flex;justify-content:space-between;padding:5px 0}
.code{font-size:44px;font-weight:800;letter-spacing:12px;color:var(--cy);text-shadow:0 0 14px var(--cy)}
.st{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:6px 8px;text-align:center;font-weight:800;font-size:18px}
.st small{display:block;font-size:10px;color:var(--mu);font-weight:500;letter-spacing:1px;text-transform:uppercase}
.st.rd{border-color:var(--rd);box-shadow:0 0 12px #ff2d5555}.st.cy{border-color:var(--cy);box-shadow:0 0 12px #19e6ff55}
#lm{height:250px;flex:none}#gm{flex:1;min-height:200px}
#lm,#gm{border-radius:14px;border:1px solid var(--ln);background:#05050a}
#tm{display:flex;gap:6px;flex-wrap:wrap;font-size:13px}
.chip{border:1px solid var(--ln);border-radius:20px;padding:3px 10px}.chip.rd{border-color:var(--rd)}.chip.cy{border-color:var(--cy)}
.sheet{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:1000;display:flex;flex-direction:column;gap:8px;box-shadow:0 0 30px #000}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#1c0710;border:1px solid var(--rd);border-radius:20px;padding:8px 16px;opacity:0;transition:opacity .3s;z-index:2000;pointer-events:none;text-align:center;max-width:92%}
body.al::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1500;box-shadow:inset 0 0 70px 12px var(--rd);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
.dot{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}
.dot.h{--c:#ff2d55}.dot.g{--c:#19e6ff}.dot.x{--c:#666}.dot.me{background:#fff;outline:2px solid var(--c);outline-offset:2px}.dot.pg{animation:pg 1s infinite}
@keyframes pg{50%{transform:scale(1.8)}}
.lb{position:absolute;left:18px;top:-2px;font-size:11px;color:#eee;text-shadow:0 0 3px #000,0 0 3px #000;white-space:nowrap}
.leaflet-container{background:#05050a;font:inherit}.leaflet-control-attribution{font-size:9px!important;background:#0008!important;color:#aaa!important}.leaflet-control-attribution a{color:#aaa!important}
</style></head><body>
<div id="toast"></div>
<section id="home" class="on"><h1>MANHUNT</h1><div class="mu" style="text-align:center">Jagen &amp; Fliehen per GPS</div>
<div class="card"><input id="nm" type="text" placeholder="Dein Name" maxlength="12"></div>
<button id="mk">Spiel erstellen</button>
<div class="card row"><input id="cd" type="text" placeholder="CODE" maxlength="4" style="text-transform:uppercase;letter-spacing:6px;text-align:center"><button id="jn" class="c">Beitreten</button></div>
<div class="mu" style="font-size:13px">Bist du rausgeflogen? Gib Code und exakt deinen alten Namen ein, dann geht es im laufenden Spiel weiter.</div>
<div id="err" class="rd"></div></section>
<section id="wait"><h1 style="font-size:24px">Verbinde…</h1></section>
<section id="lobby"><div class="card" style="text-align:center"><div class="mu">Spiel-Code</div><div id="lc" class="code"></div></div>
<div id="lm"></div><div id="lh" class="mu" style="font-size:13px"></div><button id="me" class="c">📍 Startpunkt = meine Position</button>
<div class="card"><b>Spieler <span id="pc"></span></b><div id="pls"></div></div>
<div class="card" id="st"></div><button id="go">Jagd starten</button><button id="lv" class="g">Verlassen</button></section>
<section id="game" style="padding:8px;gap:8px"><div class="row" id="hud"></div><div id="ban" class="card" hidden></div><div id="gm"></div><div id="tm"></div>
<div class="row"><button id="ct" class="g">◎ Folgen</button><button id="ac"></button></div></section>
<section id="end"><h1 id="wn" style="font-size:30px;letter-spacing:2px"></h1><div class="card" id="rs"></div><button id="lv2">Zurück zum Start</button></section>
<div id="sh" class="card sheet" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script><script type="module" src="app.js"></script></body></html>
